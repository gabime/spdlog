name: multi-module-tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - GENERATOR: "Visual Studio 17 2022"
            BUILD_TYPE: Release
            CXX_STANDARD: 17
            USE_STD_FORMAT: 'OFF'
          - GENERATOR: "Visual Studio 17 2022"
            BUILD_TYPE: Release
            CXX_STANDARD: 20
            USE_STD_FORMAT: 'ON'
          - GENERATOR: "Visual Studio 17 2022"
            BUILD_TYPE: Debug
            CXX_STANDARD: 17
            USE_STD_FORMAT: 'OFF'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure CMake
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G "${{ matrix.config.GENERATOR }}" -A x64 `
            -D CMAKE_BUILD_TYPE=${{ matrix.config.BUILD_TYPE }} `
            -D CMAKE_CXX_STANDARD=${{ matrix.config.CXX_STANDARD }} `
            -D SPDLOG_BUILD_WARNINGS=ON `
            -D SPDLOG_BUILD_MULTI_MODULE_TESTS=ON `
            -D SPDLOG_USE_STD_FORMAT=${{ matrix.config.USE_STD_FORMAT }} `
            ..

      - name: Build
        shell: pwsh
        run: |
          cd build
          cmake --build . --parallel --config ${{ matrix.config.BUILD_TYPE }}

      - name: Run Multi-Module Tests
        shell: pwsh
        env:
          PATH: ${{ env.PATH }};${{ github.workspace }}\build\_deps\catch2-build\src\${{ matrix.config.BUILD_TYPE }};${{ github.workspace }}\build\${{ matrix.config.BUILD_TYPE }}
        run: |
          build\tests\multi_module\${{ matrix.config.BUILD_TYPE }}\spdlog-multi-module-tests.exe

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - compiler: gcc
            version: 11
            build_type: Release
            cppstd: 17
            use_std_format: 'OFF'
          - compiler: gcc
            version: 12
            build_type: Release
            cppstd: 20
            use_std_format: 'ON'
          - compiler: gcc
            version: 12
            build_type: Debug
            cppstd: 17
            use_std_format: 'OFF'
          - compiler: clang
            version: 15
            build_type: Release
            cppstd: 20
            use_std_format: 'ON'

    container:
      image: ${{ matrix.config.compiler == 'clang' && 'teeks99/clang-ubuntu' || matrix.config.compiler }}:${{ matrix.config.version }}
    name: "${{ matrix.config.compiler}} ${{ matrix.config.version }} (C++${{ matrix.config.cppstd }} ${{ matrix.config.build_type }})"

    steps:
      - uses: actions/checkout@v6

      - name: Setup dependencies
        run: |
          apt-get update
          apt-get install -y curl git pkg-config
          CMAKE_VERSION="3.24.2"
          curl -sSL https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh -o install-cmake.sh
          chmod +x install-cmake.sh
          ./install-cmake.sh --prefix=/usr/local --skip-license

      - name: Setup Clang compiler
        if: matrix.config.compiler == 'clang'
        run: |
          echo "CXXFLAGS=-stdlib=libc++" >> $GITHUB_ENV
          echo "CC=clang-${{ matrix.config.version }}" >> $GITHUB_ENV
          echo "CXX=clang++-${{ matrix.config.version }}" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cppstd }} \
            -DSPDLOG_BUILD_WARNINGS=ON \
            -DSPDLOG_BUILD_MULTI_MODULE_TESTS=ON \
            -DSPDLOG_USE_STD_FORMAT=${{ matrix.config.use_std_format }}
          make -j 4

      - name: Run Multi-Module Tests
        run: |
          cd build
          ctest -R spdlog-multi-module-tests --output-on-failure

  macos:
    runs-on: macOS-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - build_type: Release
            cppstd: 17
            use_std_format: 'OFF'
          - build_type: Release
            cppstd: 20
            use_std_format: 'ON'
          - build_type: Debug
            cppstd: 17
            use_std_format: 'OFF'

    name: "macOS Clang (C++${{ matrix.config.cppstd }} ${{ matrix.config.build_type }})"

    steps:
      - uses: actions/checkout@v6

      - name: Configure and Build
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cppstd }} \
            -DSPDLOG_BUILD_WARNINGS=ON \
            -DSPDLOG_BUILD_MULTI_MODULE_TESTS=ON \
            -DSPDLOG_USE_STD_FORMAT=${{ matrix.config.use_std_format }}
          make -j 4

      - name: Run Multi-Module Tests
        run: |
          cd build
          ctest -R spdlog-multi-module-tests --output-on-failure
