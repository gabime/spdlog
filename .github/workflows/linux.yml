name: linux

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Linux build matrix
  # -----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          - { compiler: gcc, version: 9, build_type: Release, cppstd: 11 }
          - { compiler: gcc, version: 11, build_type: Debug, cppstd: 17 }
          - { compiler: gcc, version: 12, build_type: Release, cppstd: 20 }
          - { compiler: gcc, version: 12, build_type: Debug, cppstd: 20, asan: ON }
          - { compiler: clang, version: 12, build_type: Debug, cppstd: 17 }
          - { compiler: clang, version: 15, build_type: Release, cppstd: 20, tsan: ON }
    container:
      image: ${{ matrix.config.compiler == 'clang' && 'teeks99/clang-ubuntu' || matrix.config.compiler }}:${{ matrix.config.version }}
    name: "${{ matrix.config.compiler}} ${{ matrix.config.version }} (C++${{ matrix.config.cppstd }} ${{ matrix.config.build_type }} ${{ matrix.config.asan == 'ON' && 'ASAN' || '' }}${{ matrix.config.tsan == 'ON' && 'TSAN' || '' }})"
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          apt-get update
          apt-get install -y curl git pkg-config libsystemd-dev
          CMAKE_VERSION="3.24.2"
          curl -sSL https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh -o install-cmake.sh
          chmod +x install-cmake.sh
          ./install-cmake.sh --prefix=/usr/local --skip-license
      - name: Setup Compiler
        if: matrix.config.compiler == 'clang'
        run: |
          scripts/ci_setup_clang.sh "${{ matrix.config.version }}"
          echo "CXXFLAGS=-stdlib=libc++" >> $GITHUB_ENV          
          echo "CC=clang-${{ matrix.config.version }}" >> $GITHUB_ENV
          echo "CXX=clang++-${{ matrix.config.version }}" >> $GITHUB_ENV
      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cppstd }} \
            -DSPDLOG_BUILD_EXAMPLE=${{ matrix.config.examples || 'ON' }} \
            -DSPDLOG_BUILD_EXAMPLE_HO=${{ matrix.config.examples || 'ON' }} \
            -DSPDLOG_BUILD_WARNINGS=ON \
            -DSPDLOG_BUILD_BENCH=OFF \
            -DSPDLOG_BUILD_TESTS=ON \
            -DSPDLOG_BUILD_TESTS_HO=OFF \
            -DSPDLOG_SANITIZE_ADDRESS=${{ matrix.config.asan || 'OFF' }} \
            -DSPDLOG_SANITIZE_THREAD=${{ matrix.config.tsan || 'OFF' }}
          make -j 4
          ctest -j 4 --output-on-failure

  # -----------------------------------------------------------------------
  # C++20 named module (opt-in, needs CMake >= 3.28 and a module-capable compiler,
  # so it cannot share the matrix above which pins CMake 3.24.2)
  # -----------------------------------------------------------------------
  build_module:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: "gcc 14", cc: gcc-14, cxx: g++-14, apt: "g++-14" }
          - { name: "clang 18 libc++", cc: clang-18, cxx: clang++-18,
              apt: "clang-18 libc++-18-dev libc++abi-18-dev", cxxflags: "-stdlib=libc++" }
          - { name: "gcc 14 std::format", cc: gcc-14, cxx: g++-14, apt: "g++-14", std_format: "ON" }
          - { name: "gcc 14 external fmt", cc: gcc-14, cxx: g++-14, apt: "g++-14 libfmt-dev", fmt_external: "ON" }
    name: "C++20 module (${{ matrix.config.name }})"
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.config.apt }}
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
      - name: Build and test
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
          CXXFLAGS: ${{ matrix.config.cxxflags }}
        run: |
          cmake -S . -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DSPDLOG_BUILD_MODULE=ON             -DSPDLOG_BUILD_EXAMPLE=ON             -DSPDLOG_BUILD_TESTS=ON             -DSPDLOG_BUILD_WARNINGS=ON             -DSPDLOG_USE_STD_FORMAT=${{ matrix.config.std_format || 'OFF' }}             -DSPDLOG_FMT_EXTERNAL=${{ matrix.config.fmt_external || 'OFF' }}
          cmake --build build -j 4
          ctest --test-dir build -j 1 --output-on-failure

  # -----------------------------------------------------------------------
  # The module under a custom namespace - the most likely place for the
  # namespace override feature to regress
  # -----------------------------------------------------------------------
  build_module_namespace_override:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    name: "C++20 module (namespace override)"
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
      - name: "Strict rename"
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/ns-rename -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DSPDLOG_BUILD_MODULE=ON             -DCMAKE_CXX_FLAGS="-DSPDLOG_NAMESPACE=spdlog_ns_ci_test"
          cmake --build build/ns-rename -j 4
      - name: "Inline-namespace wrap"
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          mkdir -p build
          cat > build/ns_inline_wrap.h <<'EOF'
          #pragma once
          #define SPDLOG_NAMESPACE_BEGIN namespace spdlog { inline namespace ns_ci_test {
          #define SPDLOG_NAMESPACE_END } }
          EOF
          cmake -S . -B build/ns-inline -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DSPDLOG_BUILD_MODULE=ON             -DSPDLOG_BUILD_EXAMPLE=ON             -DSPDLOG_BUILD_TESTS=ON             -DCMAKE_CXX_FLAGS="-include $GITHUB_WORKSPACE/build/ns_inline_wrap.h"
          cmake --build build/ns-inline -j 4
          ctest --test-dir build/ns-inline -j 1 --output-on-failure

  # -----------------------------------------------------------------------
  # Namespace customization regression tests
  # -----------------------------------------------------------------------
  build_namespace_override:
    runs-on: ubuntu-latest
    container: gcc:12
    defaults:
      run:
        shell: bash
    name: "Namespace override"
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          apt-get update
          apt-get install -y curl git pkg-config libsystemd-dev
          CMAKE_VERSION="3.24.2"
          curl -sSL https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh -o install-cmake.sh
          chmod +x install-cmake.sh
          ./install-cmake.sh --prefix=/usr/local --skip-license
      - name: "Strict rename — library compile-only"
        run: |
          mkdir -p build/ns-rename && cd build/ns-rename
          cmake ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DSPDLOG_BUILD_SHARED=ON \
            -DCMAKE_CXX_FLAGS="-DSPDLOG_NAMESPACE=spdlog_ns_ci_test"
          make spdlog -j 4
      - name: "Inline-namespace wrap — full build and tests"
        run: |
          mkdir -p build/ns-inline
          cat > build/ns_inline_wrap.h <<'EOF'
          #pragma once
          #define SPDLOG_NAMESPACE_BEGIN namespace spdlog { inline namespace ns_ci_test {
          #define SPDLOG_NAMESPACE_END } }
          EOF
          cd build/ns-inline
          cmake ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DSPDLOG_BUILD_EXAMPLE=ON \
            -DSPDLOG_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-include $GITHUB_WORKSPACE/build/ns_inline_wrap.h"
          make -j 4
          ctest -j 4 --output-on-failure

  # -----------------------------------------------------------------------
  # OS X build matrix
  # -----------------------------------------------------------------------
  build_osx:
    runs-on: macOS-latest
    name: "OS X Clang (C++11, Release)"
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=11 \
            -DSPDLOG_BUILD_EXAMPLE=ON \
            -DSPDLOG_BUILD_EXAMPLE_HO=ON \
            -DSPDLOG_BUILD_WARNINGS=ON \
            -DSPDLOG_BUILD_BENCH=OFF \
            -DSPDLOG_BUILD_TESTS=ON \
            -DSPDLOG_BUILD_TESTS_HO=OFF \
            -DSPDLOG_SANITIZE_ADDRESS=OFF
          make -j 4
          ctest -j 4 --output-on-failure
